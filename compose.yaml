services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8080:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PORT=8000
      - MY_PROJECT=hello-World
    env_file:
      - .env
    # volumes:
    #   - ./backend/src:/app
    develop:
      watch:
        - path: backend/requirements.txt
          action: rebuild
        - path: backend/Dockerfile
          action: rebuild
        - path: backend/src
          action: sync
          target: /app

  static_html: # custom key name
    # image: python:3.14.7-slim
    build:
      context: ./static
      dockerfile: static.Dockerfile
    ports:
      - 8000:8000
      - 3000:8000
    command: python -m http.server 8000
    volumes:
      - ./static/src:/app
